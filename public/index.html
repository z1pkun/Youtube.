<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>YouTube Downloader</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<main class="container">

  <section class="card">

    <div class="brand">
      YouTubeDownloader
    </div>

    <h1>
      動画を保存
    </h1>

    <p class="description">
      URLを入力してMP4またはMP3を選択
    </p>

    <form id="downloadForm">

      <label for="url">
        YouTube URL
      </label>

      <div class="url-row">

        <input
          id="url"
          type="url"
          placeholder="https://www.youtube.com/watch?v=..."
          autocomplete="off"
          required
        >

        <button
          id="pasteBtn"
          type="button"
          class="secondary"
        >
          貼り付け
        </button>

      </div>

      <div class="format-row">

        <button
          type="button"
          class="format active"
          data-format="mp4"
        >
          MP4
        </button>

        <button
          type="button"
          class="format"
          data-format="mp3"
        >
          MP3
        </button>

      </div>

      <label for="quality">
        品質
      </label>

      <select id="quality">

        <option value="best">
          最高品質
        </option>

        <option value="1080">
          1080p
        </option>

        <option value="720">
          720p
        </option>

        <option value="480">
          480p
        </option>

        <option value="360">
          360p
        </option>

      </select>

      <button
        type="submit"
        class="download"
      >
        ダウンロード
      </button>

    </form>

    <div
      id="status"
      class="status hidden"
    ></div>

  </section>

</main>

<script src="/app.js"></script>

</body>
</html>
